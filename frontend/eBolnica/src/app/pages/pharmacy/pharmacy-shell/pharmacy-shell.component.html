<div class="pharmacy-app">
  <header class="pharmacy-header">
    <div class="pharmacy-header-inner">
      <a routerLink="/pharmacy-dashboard" class="pharmacy-brand" aria-label="Pharmacy dashboard home">
        <span class="pharmacy-brand-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4"></path>
            <path d="M12 18v4"></path>
            <path d="M4.93 4.93l2.83 2.83"></path>
            <path d="M16.24 16.24l2.83 2.83"></path>
            <path d="M2 12h4"></path>
            <path d="M18 12h4"></path>
            <path d="M4.93 19.07l2.83-2.83"></path>
            <path d="M16.24 7.76l2.83-2.83"></path>
            <circle cx="12" cy="12" r="4"></circle>
          </svg>
        </span>
        <span>
          eBolnica Apoteka
          <span class="pharmacy-brand-sub">Pharmacy Management</span>
        </span>
      </a>

      <div class="pharmacy-header-actions">
        <span class="pharmacy-user-greeting">{{ authService.userLoggedInfo() }}</span>
        <button type="button" class="pharmacy-btn pharmacy-btn-danger pharmacy-btn-sm" (click)="authService.logout()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Logout
        </button>
      </div>
    </div>
  </header>

  @if (showNav) {
    <nav class="pharmacy-nav" aria-label="Pharmacy module navigation">
      <div class="pharmacy-nav-inner">
        <a routerLink="/pharmacy-dashboard"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }"
           class="pharmacy-nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          Dashboard
        </a>
        <a routerLink="/pharmacy/medications"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: false }"
           class="pharmacy-nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10.5 20.5 12 22l1.5-1.5"></path>
            <path d="M12 11v11"></path>
            <path d="M7 11h10"></path>
            <path d="M12 2a7 7 0 0 0-4 12.7V11a4 4 0 1 1 8 0v3.7A7 7 0 0 0 12 2z"></path>
          </svg>
          Medications
        </a>
        <a routerLink="/pharmacy/prescriptions"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: false }"
           class="pharmacy-nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          Prescriptions
        </a>
        <a routerLink="/pharmacy/inventory"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: false }"
           class="pharmacy-nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          Inventory
        </a>
      </div>
    </nav>
  }

  <main class="pharmacy-main">
    <ng-content></ng-content>
  </main>
</div>
