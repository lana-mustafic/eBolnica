<div class="pharmacy-app">
  <header class="pharmacy-header">
    <div class="pharmacy-header-inner">
      <a routerLink="/pharmacy-dashboard" class="pharmacy-brand" aria-label="Pharmacy dashboard">
        <span class="pharmacy-brand-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4"></path><path d="M12 18v4"></path>
            <path d="M4.93 4.93l2.83 2.83"></path><path d="M16.24 16.24l2.83 2.83"></path>
            <path d="M2 12h4"></path><path d="M18 12h4"></path>
            <path d="M4.93 19.07l2.83-2.83"></path><path d="M16.24 7.76l2.83-2.83"></path>
            <circle cx="12" cy="12" r="4"></circle>
          </svg>
        </span>
        <span>
          eBolnica Apoteka
          <span class="pharmacy-brand-sub">Pharmacy Management</span>
        </span>
      </a>
      <div class="pharmacy-header-actions">
        <span class="pharmacy-user-greeting">{{ authService.userLoggedInfo() }}</span>
        <button type="button" class="pharmacy-btn pharmacy-btn-danger pharmacy-btn-sm" (click)="authService.logout()">
          Logout
        </button>
      </div>
    </div>
  </header>

  <nav class="pharmacy-nav" aria-label="Pharmacy navigation">
    <div class="pharmacy-nav-inner">
      <a routerLink="/pharmacy-dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="pharmacy-nav-link">Dashboard</a>
      <a routerLink="/pharmacy/medications" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" class="pharmacy-nav-link">Medications</a>
      <a routerLink="/pharmacy/prescriptions" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" class="pharmacy-nav-link">Prescriptions</a>
      <a routerLink="/pharmacy/inventory" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" class="pharmacy-nav-link">Inventory</a>
    </div>
  </nav>

  <main class="pharmacy-main">
    <ng-content></ng-content>
  </main>
</div>
