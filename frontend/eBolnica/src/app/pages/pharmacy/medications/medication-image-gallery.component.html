<section class="image-gallery" aria-label="Medication images">
  <h3 class="gallery-title">Images</h3>

  @if (errorMessage) {
    <div class="gallery-error">{{ errorMessage }}</div>
  }

  <!-- Main Image Display -->
  <div class="main-image-container">
    @if (selectedImageUrl) {
      <button
        type="button"
        class="main-image-button"
        (click)="openLightbox()"
        [attr.aria-label]="'View ' + medicationName + ' image in fullscreen'">
        <img
          [src]="selectedImageUrl"
          [alt]="medicationName"
          class="main-image"
          loading="lazy" />
        <span class="zoom-hint">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
          Click to enlarge
        </span>
        @if (selectedImage?.isPrimary) {
          <span class="primary-badge">Primary</span>
        }
      </button>
    } @else {
      <div class="main-image-empty">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <p>No images uploaded yet</p>
      </div>
    }
  </div>

  <!-- Thumbnail Strip -->
  @if (images.length > 0) {
    <div class="thumbnail-strip" role="listbox" aria-label="Image thumbnails">
      @for (image of images; track image.id; let i = $index) {
        <button
          type="button"
          class="strip-thumbnail"
          [class.active]="i === selectedIndex"
          [class.is-primary]="image.isPrimary"
          (click)="selectImage(i)"
          [attr.aria-selected]="i === selectedIndex"
          role="option"
          [attr.aria-label]="'Image ' + (i + 1) + (image.isPrimary ? ', primary' : '')">
          <img
            [src]="resolveUrl(image.imageUrl)"
            [alt]="medicationName + ' thumbnail ' + (i + 1)"
            loading="lazy"
            width="64"
            height="64" />
        </button>
      }
    </div>
  }

  <!-- Management Controls -->
  <div class="gallery-controls">
    <label class="btn btn-upload" [class.disabled]="isUploading">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      {{ isUploading ? 'Uploading...' : 'Upload Image' }}
      <input
        type="file"
        accept="image/jpeg,image/png,image/webp"
        (change)="onUpload($event)"
        [disabled]="isUploading"
        hidden />
    </label>

    <button
      type="button"
      class="btn btn-secondary-action"
      (click)="setPrimary()"
      [disabled]="!selectedImage || selectedImage.isPrimary || isManaging">
      Set as Primary
    </button>

    <button
      type="button"
      class="btn btn-danger-action"
      (click)="confirmDelete()"
      [disabled]="!selectedImage || isManaging">
      Delete Image
    </button>
  </div>
</section>

<app-medication-image-lightbox
  [isOpen]="lightboxOpen"
  [images]="images"
  [currentIndex]="selectedIndex"
  [resolveUrl]="resolveUrl"
  (closed)="closeLightbox()"
  (indexChange)="onLightboxIndexChange($event)">
</app-medication-image-lightbox>

<app-confirm-modal
  [show]="showDeleteConfirm"
  message="Are you sure you want to delete this image? This action cannot be undone."
  (confirmed)="deleteSelected()"
  (cancelled)="cancelDelete()">
</app-confirm-modal>
