<div class="medication-thumbnail" [class.loaded]="isLoaded">
  @if (!resolvedUrl || hasError) {
    <span class="medication-thumbnail-placeholder" [attr.aria-label]="alt + ' – no image'">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.5 20.5c-4.5-2-6-6.5-4-10.5 2-4 6.5-5.5 10.5-3.5 4 2 5.5 6.5 3.5 10.5-2 4-6.5 5.5-10.5 3.5z"/>
        <line x1="8" y1="8" x2="16" y2="16"/>
        <line x1="16" y1="8" x2="8" y2="16"/>
      </svg>
    </span>
  } @else if (shouldLoad) {
    <img
      [src]="resolvedUrl"
      [alt]="alt"
      loading="lazy"
      decoding="async"
      width="48"
      height="48"
      class="medication-thumbnail-img"
      (load)="onLoad()"
      (error)="onError()" />
  } @else {
    <span class="medication-thumbnail-skeleton" aria-hidden="true"></span>
  }
</div>
