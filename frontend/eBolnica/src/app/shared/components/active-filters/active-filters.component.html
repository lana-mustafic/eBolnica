<div class="active-filters" *ngIf="hasActiveFilters">
  <div class="active-filters-header">
    <h6 class="active-filters-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
      </svg>
      Active Filters ({{ activeFilters.length }})
    </h6>
    <span class="filter-summary-text" *ngIf="activeFilters.length > 0">
      Showing results for:
      <span *ngFor="let filter of activeFilters; let last = last" class="filter-summary-item">
        {{ filter.value }}<span *ngIf="!last"> + </span>
      </span>
    </span>
  </div>
  
  <div class="filter-badges" role="list" aria-label="Active filters">
    <span 
      *ngFor="let filter of activeFilters; trackBy: trackByFilterKey" 
      class="filter-badge"
      [class]="getBadgeClass(filter.type)"
      role="listitem"
      [attr.aria-label]="filter.label + ': ' + filter.value">
      <span class="filter-label">{{ filter.label }}:</span>
      <span class="filter-value">{{ filter.value }}</span>
      <button 
        class="filter-remove" 
        (click)="onRemoveFilter(filter.key)"
        [attr.aria-label]="'Remove ' + filter.label + ' filter'"
        type="button"
        tabindex="0">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </span>
  </div>
</div>
