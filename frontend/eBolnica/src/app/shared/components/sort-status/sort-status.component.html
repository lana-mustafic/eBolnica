<div 
  *ngIf="sortColumn" 
  class="sort-status"
  [class.sort-changed]="sortChanged"
  [class.default-sort]="isDefaultSort"
  role="status"
  [attr.aria-label]="sortAnnouncement">
  
  <!-- Screen reader announcement -->
  <div aria-live="polite" aria-atomic="true" class="sr-only">
    {{ sortAnnouncement }}
  </div>

  <!-- Sort Icon -->
  <div class="sort-icon" 
       [class.asc]="sortOrder === 'asc'"
       [class.desc]="sortOrder === 'desc'"
       [attr.aria-hidden]="true">
    {{ getSortIcon() }}
  </div>

  <!-- Sort Text -->
  <div class="sort-text">
    <span *ngIf="isDefaultSort" class="default-indicator">
      Showing newest items first (default)
    </span>
    <span *ngIf="!isDefaultSort">
      Sorted by: <strong>{{ getColumnDisplayName(sortColumn) }}</strong> 
      ({{ getSortDirectionText() }})
    </span>
  </div>

  <!-- Reset Button -->
  <button 
    *ngIf="!isDefaultSort && showResetButton"
    (click)="onReset()"
    class="btn-reset-sort"
    type="button"
    [attr.aria-label]="'Reset to default sorting'"
    title="Reset to default sorting">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="reset-icon">
      <polyline points="23 4 23 10 17 10"></polyline>
      <polyline points="1 20 1 14 7 14"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    </svg>
    <span class="btn-text">Reset</span>
  </button>
</div>
