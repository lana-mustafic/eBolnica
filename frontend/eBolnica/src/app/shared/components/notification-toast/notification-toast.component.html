<div class="notification-toast" 
     [class.toast-success]="notification.type === 'success'"
     [class.toast-error]="notification.type === 'error'"
     [class.toast-info]="notification.type === 'info'"
     [class.toast-warning]="notification.type === 'warning'"
     [attr.role]="'alert'"
     [attr.aria-live]="notification.type === 'error' ? 'assertive' : 'polite'"
     [attr.aria-atomic]="'true'"
     [attr.aria-label]="getAriaLabel()">
  
  <div class="toast-icon">
    <span [innerHTML]="getIconClass()"></span>
  </div>
  
  <div class="toast-content">
    <h4 class="toast-title">{{ notification.title }}</h4>
    <p class="toast-message">{{ notification.message }}</p>
    <small class="toast-timestamp">{{ notification.timestamp | date:'shortTime' }}</small>
  </div>
  
  <div class="toast-actions">
    <button *ngIf="notification.options?.actionText" 
            (click)="onAction()"
            class="toast-action-btn"
            type="button"
            [attr.aria-label]="notification.options?.actionText || ''">
      {{ notification.options?.actionText }}
    </button>
    <button (click)="onDismiss()"
            class="toast-close"
            type="button"
            aria-label="Close notification">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
</div>
