<div class="filter-summary">
  <!-- Loading Indicator -->
  <div *ngIf="isLoading" class="filter-loading" aria-live="polite" aria-busy="true">
    <svg class="spinner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
    </svg>
    <span>Filtering results...</span>
  </div>

  <!-- Result Count and Clear Button -->
  <div class="summary-header" *ngIf="!isLoading || totalCount > 0">
    <div class="result-count" [class.no-results]="totalCount === 0">
      <span>{{ getResultText() }}</span>
    </div>
    
    <button 
      *ngIf="hasActiveFilters"
      (click)="onClearAll()"
      class="btn btn-clear-all"
      [attr.aria-label]="'Clear all ' + activeFilterCount + ' active filters'"
      [title]="getClearButtonText()"
      type="button">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
      <span>{{ getClearButtonText() }}</span>
    </button>
  </div>
</div>
