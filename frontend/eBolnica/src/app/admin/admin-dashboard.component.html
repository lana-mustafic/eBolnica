<h2>Admin Dashboard</h2>

 <div class="d-flex mb-3">
    <label class="me-2 fw-bold">Filter by role:</label>
    <select class="form-select w-auto" [(ngModel)]="userType" (ngModelChange)="onFilterChange($event)">
      <option value="">All</option>
      <option value="Doctor">Doctors</option>
      <option value="Patient">Patients</option>
    </select>
</div>

<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email</th>
      <th>Role</th>
      <th>Status</th>
      <th>Change Status</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let user of users">
      <td>{{ user.firstName }}</td>
      <td>{{ user.lastName }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.userType }}</td>
      <td>{{ user.doctorInfo?.registrationStatus || 'N/A' }}</td>
      <td>
        <ng-container *ngIf="user.userType === 'Doctor'">
      <button class="btn" (click)="changeStatus(user, 'Approved')" 
              [disabled]="user.doctorInfo?.registrationStatus === 'Approved'">
        Approve
      </button>
      <button class="btn" (click)="changeStatus(user, 'Rejected')" 
              [disabled]="user.doctorInfo?.registrationStatus === 'Rejected'">
        Reject
      </button>
        </ng-container>
      </td>
    </tr>
  </tbody>
</table>

<div class="justify-content-between align-items-center mt-3">
  <div>User count: {{ users.length }} of total: {{ totalCount }}</div>
  <div>
    <button class="btn btn-outline-secondary btn-sm me-2"
            (click)="onPageChange(page - 1)"
            [disabled]="page === 1">
      Previous
    </button>
    <span>Page {{ page }} of {{ totalPages }}</span>
    <button class="btn btn-outline-secondary btn-sm me-2"
            (click)="onPageChange(page + 1)"
            [disabled]="page >= totalCount / pageSize">
      Next
    </button>
  </div>
</div>

<nav class="navbar d-flex justify-content-end p-2">
  <button *ngIf="authService.isLoggedIn()"
          class="btn btn-danger"
          (click)="authService.logout()">
    Logout
  </button>
