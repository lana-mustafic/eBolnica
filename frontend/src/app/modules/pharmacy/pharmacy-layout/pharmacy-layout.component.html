@if (isHandset) {
  <mat-toolbar class="mobile-toolbar">
    <button mat-icon-button type="button" (click)="sidenav?.toggle()" aria-label="Meni">
      <app-pharmacy-icon name="layout-dashboard" [size]="22"></app-pharmacy-icon>
    </button>
    <span class="mobile-brand">eBolnica</span>
  </mat-toolbar>
}

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #sidenav
    [mode]="isHandset ? 'over' : 'side'"
    [opened]="!isHandset"
    class="sidenav"
  >
    <div class="sidebar-brand">
      <div class="brand-copy">
        <span class="brand-title">eBolnica</span>
        <span class="brand-subtitle">Apoteka</span>
      </div>
    </div>

    <nav class="sidebar-nav" aria-label="Pharmacy navigation">
      <a
        class="nav-link"
        routerLink="/pharmacy/dashboard"
        routerLinkActive="active"
        (click)="closeSidenavOnNavigate()"
      >
        <app-pharmacy-icon name="layout-dashboard" [size]="20"></app-pharmacy-icon>
        <span>Dashboard</span>
      </a>

      <a
        class="nav-link"
        routerLink="/pharmacy/medications"
        routerLinkActive="active"
        (click)="closeSidenavOnNavigate()"
      >
        <app-pharmacy-icon name="pill" [size]="20"></app-pharmacy-icon>
        <span>Lijekovi</span>
      </a>

      <a
        class="nav-link"
        routerLink="/pharmacy/inventory"
        routerLinkActive="active"
        (click)="closeSidenavOnNavigate()"
      >
        <app-pharmacy-icon name="package" [size]="20"></app-pharmacy-icon>
        <span>Inventar</span>
      </a>

      <a
        class="nav-link"
        routerLink="/pharmacy/prescriptions"
        routerLinkActive="active"
        (click)="closeSidenavOnNavigate()"
      >
        <app-pharmacy-icon name="clipboard" [size]="20"></app-pharmacy-icon>
        <span>Recepti</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-divider"></div>
      <div class="sidebar-user">
        <div class="user-avatar">
          <app-pharmacy-icon name="user" [size]="18"></app-pharmacy-icon>
        </div>
        <div class="user-meta">
          <span class="user-role">Farmaceut</span>
          <span class="user-status">
            <span class="status-dot" aria-hidden="true"></span>
            Online
          </span>
        </div>
      </div>
      <a class="nav-link logout-link" routerLink="/auth/logout" (click)="closeSidenavOnNavigate()">
        <app-pharmacy-icon name="log-out" [size]="20"></app-pharmacy-icon>
        <span>Odjava</span>
      </a>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
