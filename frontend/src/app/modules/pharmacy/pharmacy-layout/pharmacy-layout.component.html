@if (isHandset) {
  <mat-toolbar class="mobile-toolbar">
    <button mat-icon-button type="button" (click)="sidenav?.toggle()" aria-label="Meni">
      <mat-icon>menu</mat-icon>
    </button>
    <span>eBolnica Apoteka</span>
  </mat-toolbar>
}

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #sidenav
    [mode]="isHandset ? 'over' : 'side'"
    [opened]="!isHandset"
    class="sidenav"
  >
    <div class="sidebar-header">
      <div class="user-info">
        <div class="user-avatar">
          <mat-icon>local_pharmacy</mat-icon>
        </div>
        <div class="user-details">
          <div class="user-email">{{ auth.currentUser()?.email }}</div>
          <div class="user-role">
            <mat-chip class="role-chip pharmacist">
              <mat-icon>medication</mat-icon>
              Farmaceut
            </mat-chip>
          </div>
        </div>
      </div>
    </div>

    <mat-nav-list>
      <div class="nav-section-title">eBolnica Apoteka</div>

      <a mat-list-item routerLink="/pharmacy/dashboard" routerLinkActive="active" (click)="closeSidenavOnNavigate()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>

      <a mat-list-item routerLink="/pharmacy/medications" routerLinkActive="active" (click)="closeSidenavOnNavigate()">
        <mat-icon matListItemIcon>medication_liquid</mat-icon>
        <span matListItemTitle>Lijekovi</span>
      </a>

      <a mat-list-item routerLink="/pharmacy/inventory" routerLinkActive="active" (click)="closeSidenavOnNavigate()">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Inventar</span>
      </a>

      <a mat-list-item routerLink="/pharmacy/prescriptions" routerLinkActive="active" (click)="closeSidenavOnNavigate()">
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        <span matListItemTitle>Recepti</span>
      </a>

      <mat-divider></mat-divider>

      <a mat-list-item routerLink="/auth/logout" class="logout-item" (click)="closeSidenavOnNavigate()">
        <mat-icon matListItemIcon>logout</mat-icon>
        <span matListItemTitle>Odjava</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
